[workspace]
resolver = "2"
members = [
    "crates/dashboard-domain",
    "crates/dashboard-storage",
    "crates/dashboard-protocol",
    "crates/dashboard-core",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dashboard-domain = { path = "crates/dashboard-domain" }
dashboard-storage = { path = "crates/dashboard-storage" }
dashboard-protocol = { path = "crates/dashboard-protocol" }
dashboard-core = { path = "crates/dashboard-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
